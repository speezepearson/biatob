{% extends 'base_page.html' %}
{% block title %} {{ title }} {% endblock %}
{% block page_body %}
  <script type="text/javascript" src="/elm/Prediction.js"></script>
  <script type="text/javascript">

    var predictions = {{ predictions | tojson }};
    var predictionId = {{ prediction_id | tojson }};

    main({elmApp: Elm.Elements.Prediction, flags: {predictions, predictionId}});
    var stakeField = document.getElementById('stakeField');
    if (stakeField) stakeField.focus();
    else {
      var resolveNotesField = document.getElementById('resolveNotesField');
      if (resolveNotesField) resolveNotesField.focus();
    }
  </script>
{% endblock %}
